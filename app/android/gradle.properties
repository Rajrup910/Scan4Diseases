org.gradle.jvmargs=-Xmx2048M -XX:MaxMetaspaceSize=512m -XX:+UseParallelGC -Dfile.encoding=UTF-8
# This machine is RAM-tight (~15GB, shared with Android Studio). A detached Gradle
# daemon was being OOM-killed mid-build ("daemon disappeared"); run in-process and
# single-threaded so the build fits in the available memory.
org.gradle.daemon=false
org.gradle.parallel=false
android.useAndroidX=true
# Jetifier (legacy support-library -> AndroidX rewriting) is unneeded here — every
# dependency is already AndroidX — and its JetifyTransform was OOM-ing the build.
android.enableJetifier=false

# Build with JDK 21 (LTS), not the JDK 25 bundled with Android Studio.
# Gradle's Groovy engine cannot parse Java 25 class files ("Unsupported class file
# major version 69"), so the build script itself fails to compile on JDK 25.
# Flutter's supported JDKs are 17 and 21.
org.gradle.java.home=C:/Program Files/Microsoft/jdk-21.0.12.8-hotspot
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false

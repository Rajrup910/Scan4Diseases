// Migrated to Flutter's declarative Gradle plugin application.
//
// The old style -- `apply from: ".../app_plugin_loader.gradle"` at the bottom of this
// file -- was removed by the Flutter tool and now fails the build with:
//   "You are applying Flutter's app_plugin_loader Gradle plugin imperatively ...
//    which is not possible anymore."
// See https://flutter.dev/to/flutter-gradle-plugin-apply
pluginManagement {
    def flutterSdkPath = {
        def properties = new Properties()
        file("local.properties").withInputStream { properties.load(it) }
        def flutterSdkPath = properties.getProperty("flutter.sdk")
        assert flutterSdkPath != null, "flutter.sdk not set in local.properties"
        return flutterSdkPath
    }()

    includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id "dev.flutter.flutter-plugin-loader" version "1.0.0"
    // AGP 8.7.3 + Kotlin 1.9.24 are compatible with Gradle 8.14.3 and JDK 21.
    id "com.android.application" version "8.11.1" apply false
    id "org.jetbrains.kotlin.android" version "2.3.20" apply false
}

include ":app"
